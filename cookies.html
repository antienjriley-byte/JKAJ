<!DOCTYPE html>
<html>
<head>
  <title>Chocolate Chip Cookies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Chocolate Chip Cookies</h1>

<h2>Ingredients</h2>
<ul>
  <li>1 cup sugar</li>
  <li>2 cups flour</li>
  <li>Chocolate chips</li>
  <li>1 egg</li>
</ul>

<h2>Steps</h2>
<ol>
  <li>Mix ingredients.</li>
  <li>Shape into cookies.</li>
  <li>Bake at 350°F for 12 minutes.</li>
</ol>

</body>
</html>
